<script>
    window.MAImages = window.MAImages || (() => {
        const extensiones = ['png', 'jpg', 'jpeg'];
        const cache = new Map();

        function esUrlDirecta(valor) {
            return /^(?:https?:|data:|blob:)/i.test(String(valor || ''));
        }

        function separarUrl(valor) {
            const texto = String(valor || '').trim();
            const coincidencia = texto.match(/^([^?#]+)([?#].*)?$/);
            return { ruta: coincidencia ? coincidencia[1] : texto, sufijo: coincidencia?.[2] || '' };
        }

        function candidatosPara(valor) {
            const texto = String(valor || '').trim();
            if (!texto) return [];
            if (esUrlDirecta(texto)) return [texto];

            const { ruta, sufijo } = separarUrl(texto);
            const extension = ruta.match(/\.(png|jpe?g)$/i)?.[1]?.toLowerCase();
            const base = extension ? ruta.replace(/\.(png|jpe?g)$/i, '') : ruta;
            const candidatos = [];

            if (extension) candidatos.push(`${base}.${extension}${sufijo}`);
            extensiones.forEach(ext => candidatos.push(`${base}.${ext}${sufijo}`));
            return [...new Set(candidatos)];
        }

        function comprobar(url) {
            return new Promise(resolve => {
                if (!url) return resolve(null);
                if (esUrlDirecta(url)) return resolve(url);
                const imagen = new Image();
                imagen.onload = () => resolve(url);
                imagen.onerror = () => resolve(null);
                imagen.src = url;
            });
        }

        async function resolver(...entradas) {
            const lista = entradas.flat(Infinity).filter(Boolean);
            const clave = JSON.stringify(lista);
            if (cache.has(clave)) return cache.get(clave);

            const promesa = (async () => {
                for (const entrada of lista) {
                    for (const candidato of candidatosPara(entrada)) {
                        const encontrado = await comprobar(candidato);
                        if (encontrado) return encontrado;
                    }
                }
                return '';
            })();

            cache.set(clave, promesa);
            return promesa;
        }

        async function aplicarImagen(elemento, ...bases) {
            if (!elemento) return '';
            const url = await resolver(...bases);
            if (url) elemento.src = url;
            return url;
        }

        async function aplicarFavicon(...bases) {
            const url = await resolver(...bases);
            if (!url) return '';
            let enlace = document.querySelector('link[rel~="icon"]');
            if (!enlace) {
                enlace = document.createElement('link');
                enlace.rel = 'icon';
                document.head.appendChild(enlace);
            }
            enlace.href = url;
            enlace.type = url.toLowerCase().includes('.png') ? 'image/png' : 'image/jpeg';
            return url;
        }

        async function aplicarVariableCss(nombre, ...bases) {
            const url = await resolver(...bases);
            document.documentElement.style.setProperty(nombre, url ? `url("${url}")` : 'none');
            return url;
        }

        return { resolver, aplicarImagen, aplicarFavicon, aplicarVariableCss };
    })();
</script>

    // El domicilio es el único método habilitado.
    contenedorDomicilio.style.display = 'block';
    document.getElementById('direccion').required = true;
    document.getElementById('barrio').required = true;

    selectCiudad.addEventListener('change', () => {
        const esOtraCiudad = selectCiudad.value === 'Otro';

        contenedorCiudadOtra.style.display = esOtraCiudad ? 'block' : 'none';
        document.getElementById('ciudad_otra').required = esOtraCiudad;

        if (!esOtraCiudad) {
            document.getElementById('ciudad_otra').value = '';
        }
    });

    // =====================================================
    // PRODUCTOS ESCRITOS MANUALMENTE
    // Cada producto se escribe directamente para evitar
    // depender de listas desplegables o del catálogo.
    // =====================================================

    function addFila() {
        const id = Date.now() + Math.floor(Math.random() * 1000);
        const div = document.createElement('div');

        div.className = 'producto-row';
        div.id = `row-${id}`;

        const existeOtraFila = document.querySelectorAll('.producto-row').length > 0;

        const btnEliminarHtml = existeOtraFila
            ? `<button type="button" class="btn-remove-prod" onclick="if(confirm('¿Seguro que deseas quitar este detalle de tu pedido?')) document.getElementById('row-${id}').remove()">×</button>`
            : '';

        div.innerHTML = `
            ${btnEliminarHtml}

            <div class="grid-producto-cantidad">
                <div class="input-group" style="margin-bottom: 0;">
                    <label>Cant.</label>
                    <input type="number" class="inp-cant" value="1" min="1" required style="text-align: center; padding: 0;">
                </div>

                <div class="input-group" style="margin-bottom: 0;">
                    <label>Producto *</label>
                    <input type="text" class="inp-prod" required placeholder="Ej: Desayuno sabanero, mug corazón, detalle personalizado...">
                </div>
            </div>
        `;

        document.getElementById('contenedor-productos').appendChild(div);
    }

    document.getElementById('btn-add-producto').addEventListener('click', addFila);
    addFila();

    // =====================================================
    // RESPALDO POR WHATSAPP
    // Guarda primero el pedido en Firebase y luego abre
    // WhatsApp con toda la información lista para enviar
    // al número de Momentos Atractivos.
    // =====================================================

    const WHATSAPP_MOMENTOS = "573028442505";

    function formatearFechaLegible(fechaISO) {
        if (!fechaISO) return "No indicada";
        const partes = fechaISO.split("-");
        if (partes.length !== 3) return fechaISO;
        return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }

    function formatearHoraAMPM(hora24) {
        if (!hora24) return "No indicada";

        const [horaTexto, minutoTexto] = hora24.split(":");
        let hora = parseInt(horaTexto, 10);
        const minutos = minutoTexto || "00";
        const periodo = hora >= 12 ? "PM" : "AM";

        hora = hora % 12;
        if (hora === 0) hora = 12;

        return `${String(hora).padStart(2, "0")}:${minutos} ${periodo}`;
    }

    function construirMensajeWhatsApp(datos, referencia = "") {
        let mensaje = "🎁 *NUEVO PEDIDO AGENDADO - MOMENTOS ATRACTIVOS*\n\n";

        if (referencia) {
            mensaje += `*Referencia:* ${referencia}\n\n`;
        }

        mensaje += `*DATOS DE QUIEN ENVÍA*\n`;
        mensaje += `• Nombre: ${datos.cliente}\n`;
        mensaje += `• Teléfono: ${datos.whatsapp_cliente}\n\n`;

        mensaje += `*DATOS DE ENTREGA*\n`;
        mensaje += `• Método: ${datos.metodo_entrega}\n`;
        mensaje += `• Recibe: ${datos.destinatario}\n`;
        mensaje += `• Teléfono recibe: ${datos.whatsapp_destinatario}\n`;

        mensaje += `• Ciudad: ${datos.ciudad}\n`;
        mensaje += `• Barrio: ${datos.barrio}\n`;
        mensaje += `• Dirección: ${datos.direccion}\n`;

        mensaje += `\n*PEDIDO*\n`;
        mensaje += `• Detalle(s): ${datos.producto}\n`;
        if (datos.detalles_adicionales && datos.detalles_adicionales.trim() !== "") {
            mensaje += `• Color o detalles adicionales: ${datos.detalles_adicionales}\n`;
        }
        mensaje += `• Fecha de entrega: ${formatearFechaLegible(datos.fecha_entrega)}\n`;
        mensaje += `• Hora de entrega: ${formatearHoraAMPM(datos.hora_entrega)}\n\n`;

        mensaje += `*TARJETA*\n`;
        mensaje += `• De: ${datos.tarjeta_de}\n`;
        mensaje += `• Para: ${datos.tarjeta_para}\n`;

        if (datos.mensaje && datos.mensaje.trim() !== "") {
            mensaje += `• Mensaje: ${datos.mensaje}\n`;
        } else {
            mensaje += `• Mensaje: Sin mensaje\n`;
        }

        mensaje += `\n_Enviado como respaldo del pedido agendado desde el formulario web._`;

        return mensaje;
    }

    function abrirWhatsAppConRespaldo(mensaje) {
        const url = `https://wa.me/${WHATSAPP_MOMENTOS}?text=${encodeURIComponent(mensaje)}`;
        window.location.href = url;
    }

    document.getElementById('fastOrderForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const btn = document.getElementById('btnEnviar');

        btn.disabled = true;
        btn.innerText = "Agendando...";

        const metodoSeleccionado = "Domicilio";
        const ciudadFinal = selectCiudad.value === 'Otro'
            ? document.getElementById('ciudad_otra').value.trim()
            : selectCiudad.value;
        const barrioFinal = document.getElementById('barrio').value.trim();
        const direccionFinal = document.getElementById('direccion').value.trim();

        if (!ciudadFinal) {
            alert("Por favor indica la ciudad de entrega.");
            btn.disabled = false;
            btn.innerText = "Confirmar mi Pedido";
            return;
        }

        if (!barrioFinal || !direccionFinal) {
            alert("Por favor completa barrio y dirección de entrega.");
            btn.disabled = false;
            btn.innerText = "Confirmar mi Pedido";
            return;
        }

        let prodsList = [];
        let productosValidos = true;

        document.querySelectorAll('.producto-row').forEach(row => {
            const cant = row.querySelector('.inp-cant').value;
            const nombreProd = row.querySelector('.inp-prod').value.trim();

            if (!nombreProd) {
                productosValidos = false;
                return;
            }

            prodsList.push(`${cant}x ${nombreProd}`);
        });

        if (!productosValidos || prodsList.length === 0) {
            alert("Por favor escribe el nombre de cada producto del pedido.");
            btn.disabled = false;
            btn.innerText = "Confirmar mi Pedido";
            return;
        }

        const datosPedido = {
            origen: "Redes Sociales",

            metodo_entrega: metodoSeleccionado,
            ciudad: ciudadFinal,

            cliente: document.getElementById('cliente_nombre').value.trim(),
            whatsapp_cliente: document.getElementById('cliente_whatsapp').value.trim(),

            destinatario: document.getElementById('recibe_nombre').value.trim(),
            whatsapp_destinatario: document.getElementById('recibe_whatsapp').value.trim(),

            direccion: direccionFinal,
            barrio: barrioFinal,

            producto: prodsList.join(" + "),
            detalles_adicionales: document.getElementById('detalles_adicionales').value.trim(),

            fecha_entrega: document.getElementById('fecha_entrega').value,
            hora_entrega: document.getElementById('hora_entrega').value,

            tarjeta_de: document.getElementById('tarjeta_de').value.trim(),
            tarjeta_para: document.getElementById('tarjeta_para').value.trim(),
            mensaje: document.getElementById('mensaje').value.trim(),

            estado: "Por confirmar"
        };

        try {
            const { db, collection, addDoc, serverTimestamp } = await obtenerFirebasePedido();
            datosPedido.timestamp = serverTimestamp();
            const docRef = await addDoc(collection(db, "pedidos"), datosPedido);
            const referenciaPedido = docRef.id ? docRef.id.slice(0, 8).toUpperCase() : "";
            const mensajeWhatsApp = construirMensajeWhatsApp(datosPedido, referenciaPedido);

            alert(
                "¡Pedido agendado correctamente!\n\n" +
                "Ahora se abrirá WhatsApp con una copia del pedido lista para enviarse a Momentos Atractivos como respaldo."
            );

            abrirWhatsAppConRespaldo(mensajeWhatsApp);

        } catch (err) {
            console.error("Error al guardar el pedido en Firebase:", err);

            const mensajeWhatsApp = construirMensajeWhatsApp(datosPedido);

            alert(
                "No se pudo guardar el pedido en la base de datos.\n\n" +
                "Pero para no perder la información, ahora se abrirá WhatsApp con todos los datos listos para enviarse a Momentos Atractivos.\n\n" +
                "Código: " + (err.code || "Sin código")
            );

            abrirWhatsAppConRespaldo(mensajeWhatsApp);
        }
    });
</script>


<script>
    document.addEventListener('DOMContentLoaded', () => {
        Promise.all([
            window.MAImages.aplicarFavicon('imagenes/favicon'),
            window.MAImages.aplicarImagen(document.getElementById('ma-pedido-logo'), 'imagenes/logo')
        ]).catch(error => console.warn('No fue posible resolver una imagen local:', error));
    });
</script>

</body>
